<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warung Rafi — Counter prototype</title>
<style>
:root{--bg:#f1f3ef;--surface:#fff;--raised:#f8faf6;--ink:#20322c;--muted:#718078;--line:#dce3dc;--accent:#214f40;--success:#28644a;--warning:#986326;--danger:#ac433c;--rail:#182e27;--r:10px;--space:8px}*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);font-weight:600;padding:8px 14px;transition:background .12s,transform .1s}button:hover{background:#e8eee8}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.4;cursor:default}input,select{min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink);background:var(--surface)}input{min-width:0}h1,h2,h3,p{margin:0}small,.muted{color:var(--muted)}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#183f31}.app{display:grid;grid-template-columns:88px 1fr;height:100vh;min-height:560px;min-width:860px}.rail{background:var(--rail);color:white;display:flex;flex-direction:column;align-items:center;padding:20px 8px;gap:10px}.brand{font:700 25px Georgia,serif;margin:2px 0 22px}.rail button{width:72px;min-height:68px;display:flex;align-items:center;flex-direction:column;gap:5px;border:0;color:#b8cbc2;background:transparent;font-size:11px;padding:10px 2px}.rail button.active{background:#e3eee3;color:#1c4435}.rail svg{width:22px;height:22px}.rail .bottom{margin-top:auto}.main{display:grid;grid-template-rows:56px 1fr 36px;min-height:0;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 24px;background:#fafbf8}.topbar strong{font-size:15px}.eyebrow{font-size:10px;letter-spacing:1.7px;font-weight:700;color:var(--muted)}.topbar small{margin-left:12px}.badge{font-size:11px;padding:6px 9px;border:1px solid var(--line);border-radius:6px}.work{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;min-height:0}.catalog{display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}.catalog-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.catalog h1{font-size:28px;letter-spacing:-.8px;margin:3px 0}.search{width:220px;background:#fff}.categories{display:flex;border-bottom:1px solid #ccd7cd;gap:8px;margin-bottom:16px;padding-bottom:10px}.categories button{flex:1;border-color:transparent;background:transparent;text-align:left;padding:9px 12px}.categories button.active{background:#214f40;color:white}.categories span{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:3px}.products{overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:94px;gap:8px;align-content:start;padding-right:4px}.product{text-align:left;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:12px;box-shadow:0 2px 0 #20322c05}.product .name{font-size:15px;line-height:1.2;padding-right:12px}.product .price{font-size:16px;color:var(--accent)}.product .plus{float:right;color:#82938a;font-size:20px;line-height:18px}.product.selected{background:#e5eee5;border:2px solid var(--accent);padding:11px}.qtybadge{position:absolute;right:5px;top:5px;font-size:10px;background:var(--accent);color:white;padding:2px 5px;border-radius:4px}.cart{display:grid;grid-template-rows:auto 1fr auto;background:white;border:1px solid var(--line);border-radius:14px;min-height:0;overflow:hidden;box-shadow:0 4px 18px #20322c08}.cart-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.cart-head h2{font-size:22px;margin:4px 0 12px}.cart-head input{width:100%;background:var(--raised);font-size:13px}.cart-head .headrow{display:flex;justify-content:space-between;align-items:center}.expand{padding:0 8px;font-size:11px;min-height:44px}.lines{overflow:auto;padding:0 18px}.line{padding:12px 0;border-bottom:1px solid #edf0eb}.line-title{display:flex;justify-content:space-between;gap:10px;font-size:14px}.line-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.stepper{display:flex;align-items:center;background:var(--bg);border-radius:8px}.stepper button{width:44px;height:44px;padding:0;border:0;background:transparent;font-size:20px}.stepper b{min-width:24px;text-align:center}.settle{padding:16px 18px;background:#f7f9f5;border-top:1px solid var(--line)}.total{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.total strong{font-size:30px;letter-spacing:-1px}.total span{font-size:10px;letter-spacing:1px;font-weight:700}.actions{display:grid;grid-template-columns:104px 1fr;gap:8px}.actions button{min-height:52px}.empty{height:100%;display:flex;justify-content:center;align-items:center;text-align:center;flex-direction:column;gap:10px;padding:24px;color:var(--muted)}.empty svg{height:40px;width:40px;stroke:#879c8f}.empty b{color:var(--ink);font-size:18px}.status{display:flex;align-items:center;gap:12px;padding:0 22px;font-size:11px;color:var(--muted)}.status .dot{color:var(--accent)}.status select{font-size:10px;min-height:26px;padding:3px;margin-left:auto}.sheet-note{border-left:1px solid var(--line);padding-left:12px}.listing{grid-column:1/-1;overflow:auto}.listing header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.listrow{display:grid;grid-template-columns:1fr 160px 160px;gap:16px;align-items:center;padding:20px;background:#fff;border-bottom:1px solid var(--line)}.listrow small{display:block;margin-top:6px}.overlay{position:fixed;inset:0;background:#10251d70;display:flex;align-items:center;justify-content:center;padding:24px;z-index:5}.dialog{width:820px;max-height:95vh;overflow:auto;background:var(--bg);padding:24px;border-radius:16px;box-shadow:0 24px 80px #0003;animation:appear .14s}.dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pay-layout{display:grid;grid-template-columns:1fr 1.1fr;gap:24px}.pay-summary{padding:20px;background:var(--rail);color:white;border-radius:12px}.pay-summary small{color:#b8cdc1}.pay-summary h1{font-size:36px;margin:12px 0 24px}.pay-summary .line-title{padding:10px 0;border-bottom:1px solid #ffffff25}.method{display:flex;gap:8px;margin-bottom:16px}.method button{flex:1}.method .active{border:2px solid var(--accent);background:#e4eee5}.pay-input{width:100%;font-size:28px;margin:8px 0}.quick{display:flex;gap:8px;margin:6px 0 12px}.quick button{flex:1;font-size:12px;padding:4px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keys button{font-size:20px}.pay-footer{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.pay-footer button{min-width:240px}.success{text-align:center;padding:28px}.success h1{font-size:40px;margin:16px}.form{display:grid;gap:12px}.form label{display:grid;gap:6px}.toast{position:fixed;right:32px;top:72px;background:var(--rail);color:white;padding:18px 24px;border-radius:10px;z-index:10;pointer-events:none;box-shadow:0 8px 20px #0002}.hidden{display:none!important}@keyframes appear{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:1100px){.work{grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:16px}.products{grid-template-columns:repeat(3,minmax(0,1fr))}.search{width:165px}.catalog h1{font-size:24px}.topbar small{display:none}.categories{gap:2px}.categories button{padding:8px}.cart-head,.settle{padding:14px}.lines{padding:0 14px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<body><div class="app"><aside class="rail"><div class="brand">wr.</div><button data-nav="sell" class="active"></button><button data-nav="held"></button><button data-nav="history"></button><button class="bottom" data-nav="settings"></button><span class="eyebrow" style="color:#8fa69a">KASIR</span></aside><main class="main"><header class="topbar"><div><strong>Warung Rafi</strong><small>Wedangan Dan Aneka Nasi Sayur Murah</small></div><span class="badge">PROTOTYPE · DATA CONTOH</span></header><section class="work" id="work"></section><footer class="status"><span class="dot">●</span><span id="status">Tersimpan di laptop · Semua perubahan dikirim</span><span class="sheet-note" id="sheet">Sheets terhubung</span><select id="state" aria-label="Simulasi status"><option value="online">Online</option><option value="offline">Offline</option><option value="syncing">Menyinkronkan</option><option value="pending">Antrean sync</option><option value="loading">Memuat katalog</option><option value="error">Gagal memuat</option><option value="printer">Printer error</option></select></footer></main></div><div id="overlay" class="overlay hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const icons={sell:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',held:'M12 3a9 9 0 1 0 9 9 M12 7v5l3 2 M16 3h6 M19 0v6',history:'M5 3h14v18l-3-2-4 2-4-2-3 2z M8 8h8 M8 12h8',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${(icons[n]||icons.sell).split(' M').map((p,i)=>`<path d="${i?'M':''}${p}"/>`).join('')}</svg>`;
const data={Nasi:[['Nasi Putih',3000],['Nasi Ayam Geprek',12000],['Nasi Ayam Barbeque',12000],['Nasi Ayam Lada Hitam',12000]],Lauk:[['Bakso Balado',1000],['Ceker Bacem',1000],['Tahu Opor',1000],['Mie Goreng oseng',2000],['Oseng Mihun',2000],['Tumis Kangkung',2000],['Toge Tahu Oseng',2000],['Oseng Tempe',2000],['Trancam',2000],['Tempura Barbeque',2000],['Sosis Barbeque',2000],['Sayur Bayem',2000],['Sayur Sop',2000],['Sambel Goreng Kentang',3000],['Terong Balado',3000],['Telur Dadar',4000],['Telur balado',4000],['Pindang Balado',4000],['Rempelo Ati Ungkep',4000],['Telur Opor',4000],['Soto',5000],['Ayam Ungkep',7000],['Sayap Bacem',7000],['Paha Bacem',7000],['Ayam Opor',7000],['Tempe Mendoan',1000],['Tahu Goreng',1000],['Bakwan Goreng',1000],['Tahu Bacem',1000],['Tempe Bacem',1000],['Tahu Isi',1000],['Pisang Goreng',2000]],Sundukan:['Sate Ati Ampela','Sate Usus','Sate Telur Puyuh','Sate Kulit','Sate Kikil','Sate Koyor'].map(n=>[n,3000]),Minuman:[['Air Es',1000],['Teh',3000],['Jeruk',4000],['Lemon Tea',5000],['Nutrisari Jeruk Peras',5000],['Milo',5000],['Maxtea',5000],['Good day',5000],['Beng-beng',5000],['Whitecoofe',5000],['kopi kapal api',5000],['susu coklat',5000],['susu putih',5000],['abc klepon',5000],['Jahe Kencur Jeruk',5000],['Jahe Sereh',6000],['Jahe Kencur',6000],['Teh Jahe',7000],['Jeruk Jahe',8000],['Susu Jahe',8000],['Chocolatos',10000]]};
const products=Object.entries(data).flatMap(([cat,list])=>list.map(([name,price],i)=>({id:cat+i,cat,name,price})));const $=s=>document.querySelector(s),money=n=>'Rp'+n.toLocaleString('id-ID'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cart=[],held=[],history=[],category='Lauk',search='',customer='',view='sell',expanded=false,method='Tunai',paid='',seq=1;const sum=()=>cart.reduce((n,p)=>n+p.price*p.qty,0);
function flash(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
for(const b of document.querySelectorAll('[data-nav]')){const n=b.dataset.nav;b.innerHTML=icon(n)+({sell:'Jualan',held:'Ditunda',history:'Riwayat',settings:'Pengaturan'}[n]);b.onclick=()=>n==='settings'?settings():navigate(n)}
function navigate(n){view=n;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===n));render()}
function render(){if(view!=='sell')return listing();$('#work').style.gridTemplateColumns=expanded?'1fr':'';$('#work').innerHTML=`<div class="catalog ${expanded?'hidden':''}"><div class="catalog-head"><div><div class="eyebrow">PILIH MENU · TAMBAH KE PESANAN</div><h1>Hari ini, mau apa?</h1><small id="count"></small></div><input class="search" id="search" placeholder="Cari menu…  F2" aria-label="Cari menu" value="${esc(search)}"></div><div class="categories">${Object.keys(data).map(c=>`<button data-cat="${c}" class="${category===c&&!search?'active':''}">${c}<span>${data[c].length} menu</span></button>`).join('')}</div><div class="products" id="products"></div></div><aside class="cart"><div class="cart-head"><div class="headrow"><div><div class="eyebrow">PESANAN AKTIF / ${String(seq).padStart(3,'0')}</div><h2>Pesanan pelanggan</h2></div><button class="expand" id="expand">${expanded?'Kembali':'Perbesar'}</button></div><input id="customer" placeholder="Nama pelanggan (opsional)" aria-label="Nama pelanggan" value="${esc(customer)}"></div><div class="lines" id="lines"></div><div class="settle"><div class="total"><div><span>TOTAL BAYAR</span><p class="muted" id="items" style="font-size:12px;margin-top:5px"></p></div><strong id="total"></strong></div><div class="actions"><button id="hold">Simpan dulu</button><button class="primary" id="pay">Bayar →</button></div></div></aside>`;$('#search').oninput=e=>{search=e.target.value;renderProducts()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;search='';render()});$('#customer').oninput=e=>customer=e.target.value;$('#expand').onclick=()=>{expanded=!expanded;render()};$('#hold').onclick=()=>{held.push({cart:structuredClone(cart),customer,id:seq++});cart=[];customer='';render();flash('Pesanan disimpan di Ditunda')};$('#pay').onclick=()=>{method='Tunai';paid='';payment()};renderProducts();renderCart()}
function renderProducts(){const list=products.filter(p=>search?p.name.toLowerCase().includes(search.toLowerCase()):p.cat===category);$('#count').textContent=`${search?'Hasil pencarian':category} · ${list.length} menu`;$('#products').innerHTML=list.map(p=>`<button class="product" data-product="${p.id}"><span class="name">${p.name}</span><span><b class="price">${money(p.price)}</b><span class="plus">+</span></span></button>`).join('')||'<div class="empty"><b>Menu tidak ditemukan</b><span>Coba nama lain.</span></div>';document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{const p=products.find(p=>p.id===b.dataset.product),line=cart.find(x=>x.id===p.id);if(line)line.qty++;else cart.push({...p,qty:1});renderCart()});badges()}
function badges(){document.querySelectorAll('[data-product]').forEach(b=>{let q=cart.find(p=>p.id===b.dataset.product)?.qty||0;b.classList.toggle('selected',q>0);b.querySelector('.qtybadge')?.remove();if(q)b.insertAdjacentHTML('beforeend',`<span class="qtybadge">${q}</span>`)})}
function renderCart(){$('#lines').innerHTML=cart.length?cart.map(p=>`<div class="line"><div class="line-title"><b>${p.name}</b><b>${money(p.price*p.qty)}</b></div><div class="line-bottom"><small>${money(p.price)} / pcs</small><div class="stepper"><button data-minus="${p.id}" aria-label="Kurangi ${p.name}">−</button><b>${p.qty}</b><button data-plus="${p.id}" aria-label="Tambah ${p.name}">+</button></div></div></div>`).join(''):`<div class="empty">${icon('history')}<b>Mulai pesanan pertama</b><span>Pilih menu di sebelah kiri.<br>Semua tersimpan di laptop.</span></div>`;for(const b of document.querySelectorAll('[data-minus],[data-plus]'))b.onclick=()=>{const id=b.dataset.minus||b.dataset.plus;cart.find(p=>p.id===id).qty+=b.dataset.minus?-1:1;cart=cart.filter(p=>p.qty>0);renderCart()};$('#total').textContent=money(sum());$('#items').textContent=cart.reduce((n,p)=>n+p.qty,0)+' item';$('#pay').disabled=$('#hold').disabled=!cart.length;badges()}
function show(content){$('#overlay').innerHTML=`<section class="dialog" role="dialog" aria-modal="true">${content}</section>`;$('#overlay').classList.remove('hidden');$('#close')?.addEventListener('click',close)}function close(){$('#overlay').classList.add('hidden')}
function payment(){show(`<header><div><div class="eyebrow">SELESAIKAN TRANSAKSI</div><h2>Pembayaran</h2></div><button id="close">← Ubah pesanan</button></header><div class="pay-layout"><div class="pay-summary"><small>TOTAL BAYAR</small><h1>${money(sum())}</h1>${cart.map(p=>`<div class="line-title"><span>${p.qty} × ${p.name}</span><b>${money(p.qty*p.price)}</b></div>`).join('')}<p style="margin-top:20px;font-size:12px;color:#bed0c4">${esc(customer||'Pelanggan tanpa nama')}<br>Data contoh · tidak memproses pembayaran</p></div><div><div class="method"><button id="cash" class="${method==='Tunai'?'active':''}">Tunai</button><button id="qris" class="${method==='QRIS'?'active':''}">QRIS</button></div>${method==='Tunai'?`<label>Uang diterima<input inputmode="numeric" id="paid" class="pay-input" placeholder="Rp0" value="${paid}" aria-label="Uang diterima"></label><div class="quick">${[sum(),50000,100000].filter((n,i,a)=>n>=sum()&&a.indexOf(n)===i).map(n=>`<button data-cash="${n}">${n===sum()?'Uang pas':money(n)}</button>`).join('')}</div><div class="keys">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button data-key="${k}">${k}</button>`).join('')}</div>`:`<div class="empty"><b>Scan QRIS di meja</b><p>Pastikan pembayaran benar-benar diterima sebelum menyelesaikan pesanan.</p><button id="proof">Simulasikan notifikasi QRIS</button></div>`}</div></div><div class="pay-footer"><b id="change"></b><button class="primary" id="complete">Selesaikan pesanan</button></div>`);$('#cash').onclick=()=>{method='Tunai';payment()};$('#qris').onclick=()=>{method='QRIS';payment()};if($('#paid')){$('#paid').oninput=e=>{paid=e.target.value.replace(/\D/g,'');change()};document.querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>{paid=b.dataset.cash;$('#paid').value=paid;change()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key;paid=k==='C'?'':k==='⌫'?paid.slice(0,-1):(paid+k).slice(0,10);$('#paid').value=paid;change()})}if($('#proof'))$('#proof').onclick=()=>flash('SIMULASI · QRIS diterima '+money(sum()));$('#complete').onclick=complete;change()}
function change(){let diff=Number(paid)-sum();$('#change').textContent=method==='QRIS'?'QRIS dicatat kasir':!paid?'Masukkan uang diterima':diff<0?'Masih kurang '+money(-diff):'Kembalian '+money(diff);$('#complete').disabled=method==='Tunai'&&diff<0}
function complete(){let total=sum(),change=method==='Tunai'?Number(paid)-total:total;history.unshift({cart:structuredClone(cart),customer,total,method,id:seq++,refunds:[]});cart=[];customer='';render();show(`<div class="success"><div class="eyebrow">TRANSAKSI BERHASIL · CONTOH</div><h2 style="margin-top:16px">Pesanan tersimpan</h2><p class="muted" style="margin-top:24px">${method==='Tunai'?'Kembalian pelanggan':'QRIS dicatat kasir'}</p><h1>${money(change)}</h1><button class="primary" id="close">+ Pesanan baru</button> <button id="print">Cetak ulang</button></div>`);$('#print').onclick=()=>flash('Simulasi: struk dikirim ke printer')}
function listing(){let rows=view==='held'?held:history;$('#work').style.gridTemplateColumns='1fr';$('#work').innerHTML=`<section class="listing"><header><div><div class="eyebrow">${view==='held'?'LANJUTKAN PESANAN':'CATATAN PENJUALAN'}</div><h1>${view==='held'?'Pesanan ditunda':'Riwayat pesanan'}</h1><p class="muted" style="margin-top:6px">${view==='held'?'Pesanan tetap tersimpan sampai kamu lanjutkan.':'Rincian, cetak ulang, dan pengembalian. Rekap lengkap ada di Sheets.'}</p></div><input id="filter" placeholder="Cari nama / nomor" aria-label="Cari pesanan"></header><div id="records"></div></section>`;const draw=()=>{$('#records').innerHTML=rows.filter(r=>`${r.customer} ${r.id}`.toLowerCase().includes($('#filter').value.toLowerCase())).map(r=>`<div class="listrow"><div><b>${esc(r.customer||'Pelanggan tanpa nama')}</b><small>#${r.id} · ${r.method||'Ditunda'}</small><small>${r.cart.map(p=>p.qty+' '+p.name).join(', ')}</small></div><b>${money(r.cart.reduce((n,p)=>n+p.price*p.qty,0))}</b><button data-record="${r.id}">${view==='held'?'Buka pesanan':'Lihat rincian'}</button></div>`).join('')||'<div class="empty"><b>Belum ada pesanan</b><p>Pesanan akan muncul setelah disimpan.</p></div>';document.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{let r=rows.find(r=>r.id===+b.dataset.record);if(view==='held'){if(cart.length)held.push({cart:structuredClone(cart),customer,id:seq++});cart=r.cart;customer=r.customer;held=held.filter(x=>x!==r);navigate('sell')}else detail(r)})};$('#filter').oninput=draw;draw()}
function detail(r){show(`<header><h2>Rincian pesanan #${r.id}</h2><button id="close">Tutup</button></header>${r.cart.map(p=>`<div class="listrow" style="grid-template-columns:1fr auto"><span>${p.qty} × ${p.name}</span><b>${money(p.qty*p.price)}</b></div>`).join('')}<div class="total" style="margin-top:20px"><span>TOTAL / ${r.method}</span><strong>${money(r.total)}</strong></div><button id="print">Cetak ulang struk</button> <button id="refund">Pengembalian</button><p style="margin-top:15px">${r.refunds.map(x=>money(x.amount)+' · '+x.state).join('<br>')}</p>`);$('#print').onclick=()=>flash($('#state').value==='printer'?'Printer belum dapat mencetak · transaksi tetap tersimpan':'Simulasi: struk dikirim');$('#refund').onclick=()=>refund(r)}
function refund(r){show(`<header><h2>Pengembalian pelanggan</h2><button id="close">Tutup</button></header><div class="form"><label>Nominal<input id="refundAmount" type="number" min="1"></label><label>Alasan<input id="refundReason"></label><label>Melalui<select><option>Tunai</option><option>Transfer / provider</option></select></label><p class="muted">Simulasi persetujuan pengelola. PIN contoh: 123456.</p><input id="pin" type="password" placeholder="PIN pengelola" aria-label="PIN pengelola"><label style="display:flex;align-items:center"><input id="returned" type="checkbox"> Uang sudah dikembalikan</label><button class="primary" id="saveRefund">Catat hasil</button><span id="refundError"></span></div>`);$('#saveRefund').onclick=()=>{let amount=+$('#refundAmount').value;if(amount<=0||amount>r.total-r.refunds.reduce((n,x)=>n+x.amount,0)||$('#pin').value!=='123456'||!$('#returned').checked||$('#refundReason').value.length<3){$('#refundError').textContent='Periksa nominal, alasan, PIN, dan konfirmasi pengembalian.';return}r.refunds.push({amount,state:'Berhasil'});detail(r)}}
function settings(){show(`<header><div><div class="eyebrow">PENGATURAN LAPTOP</div><h2>Printer & koneksi</h2></div><button id="close">Tutup</button></header><div class="form"><label>Printer Windows<select><option>OKAY 58D · USB · 58 mm</option></select></label><label>PIN pengelola<input type="password" placeholder="Kosong berarti tetap"></label><button id="saveSettings" class="primary">Simpan pengaturan contoh</button><details><summary style="padding:16px;cursor:pointer">Koneksi lanjutan</summary><p>SQLite lokal → sinkronisasi background → server / Sheets.</p><p>Prototype ini tidak menyimpan kredensial atau terhubung ke layanan produksi.</p></details></div>`);$('#saveSettings').onclick=()=>{close();flash('Pengaturan contoh tersimpan')}}
$('#state').onchange=e=>{const s=e.target.value;$('#status').textContent=({online:'Tersimpan di laptop · Semua perubahan dikirim',offline:'Offline · Tetap bisa berjualan',syncing:'Menyinkronkan transaksi…',pending:'Tersimpan di laptop · 3 perubahan menunggu dikirim',loading:'Memuat katalog…',error:'Katalog belum berhasil dimuat · Coba lagi',printer:'Pesanan tersimpan · Printer belum dapat mencetak'})[s];$('#sheet').textContent=s==='offline'?'Sheets menunggu koneksi':'Sheets · pembaruan background';if(s==='printer')flash('Printer belum dapat mencetak. Penjualan tetap tersimpan.');if((s==='loading'||s==='error')&&view==='sell')$('#products').innerHTML=`<div class="empty"><b>${s==='loading'?'Memuat menu…':'Katalog belum tersedia'}</b><button id="retry">Coba lagi</button></div>`;else if(view==='sell')renderProducts();if($('#retry'))$('#retry').onclick=()=>{$('#state').value='online';$('#state').dispatchEvent(new Event('change'))}};
document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();navigate('sell');$('#search').focus()}if(e.key==='Escape')close()});render();
</script></body></html>
