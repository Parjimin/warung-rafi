name: Stop superseded UI review runs
on:
  push:
    branches: ['codex/m2-ui-polish']
    paths: ['.github/workflows/stop-old-ui-review.yml']
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            for (const run_id of [36058835070, 36058986267]) {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
              if (run.head_branch !== 'codex/m2-ui-polish') throw new Error('Unexpected branch');
              if (run.status !== 'completed') await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id });
            }
