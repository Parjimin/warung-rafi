name: Sync project tracking
on:
  push:
    branches: [main]
    paths: ['.github/planning.json', '.github/workflows/tracking.yml', 'scripts/sync-tracking.cjs']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: project-tracking
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v9
        with:
          script: |
            const sync = require('./scripts/sync-tracking.cjs');
            await sync({github, context, core});
